[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codewatch"
version = "3.0.1"
description = "CodeWatch - Enterprise AI-Powered SAST Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "orjson>=3.9.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
    "flask>=3.0.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
]
ai = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.7.0",
]
integrations = [
    "semgrep>=1.0.0",
    "bandit>=1.7.0",
    "gitleaks>=8.0.0",
    "trivy>=0.50.0",
]

[project.scripts]
codewatch = "src.cli:cli"
myscan = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "PERF", "PIE", "SIM", "UP"]
ignore = [
    # Deliberate resilience patterns in the scanner engine: keep scanning
    # when a single file/module raises, and swallow expected shutdown noise.
    "BLE001",  # blind except: bare Exception in per-file scan guards
    "S110",    # try-except-pass in optional feature probes
    "S112",    # try-except-continue in per-item loops
    "RUF012",  # mutable class defaults used as static lookup tables
    "C408",    # dict(...) style tolerated in legacy modules
    "E741",    # single-letter variable names in legacy ported code
    "E402",    # import not at top of file (rare, deliberate)
    "B027",    # empty base-class methods without @abstractmethod
    "SIM105",  # contextlib.suppress vs try/except style
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true