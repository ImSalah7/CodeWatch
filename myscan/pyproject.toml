[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myscan"
version = "3.0.0"
description = "Enterprise AI-Powered SAST Platform - Security Scanner, Code Quality, Secrets Detection, Dependency Analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-php>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-csharp>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "networkx>=3.2",
    "jinja2>=3.1.0",
    "orjson>=3.9.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
]
ai = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.7.0",
]
integrations = [
    "semgrep>=1.0.0",
    "bandit>=1.7.0",
    "gitleaks>=8.0.0",
    "trivy>=0.50.0",
]

[project.scripts]
myscan = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true