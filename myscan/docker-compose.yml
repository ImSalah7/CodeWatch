services:
  myscan:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MYSCAN_AI_PROVIDER=${MYSCAN_AI_PROVIDER:-openai}
    volumes:
      - ./myscan_reports:/app/myscan_reports
    restart: unless-stopped
